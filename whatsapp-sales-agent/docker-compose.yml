# Local stack: Weaviate (hybrid BM25 + vector) and Redis (checkpoints, contacts, jobs).
# Host ports are offset from the defaults so they don't collide with other local services.
services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.34.0
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "8088:8080"
      - "50061:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate

  redis:
    image: redis:8
    ports:
      - "6390:6379"
    volumes:
      - redis_data:/data

  app:
    build: .
    profiles: ["app"]
    env_file: .env
    environment:
      WEAVIATE_HOST: weaviate
      WEAVIATE_PORT: "8080"
      WEAVIATE_GRPC_PORT: "50051"
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on: [weaviate, redis]

volumes:
  weaviate_data:
  redis_data:
