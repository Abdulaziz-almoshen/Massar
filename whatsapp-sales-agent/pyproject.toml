[project]
name = "whatsapp-sales-agent"
version = "0.1.0"
description = "AI-powered WhatsApp sales agent: LangGraph orchestration, hybrid RAG over Markdown, BANT lead scoring, human handoff"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-redis>=0.5.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.53.0",
    "weaviate-client>=4.23.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
